# Production stack (D-034): one VPS, Docker Compose, Caddy with automatic HTTPS. From the repository root:
#   docker compose -f infrastructure/compose.prod.yml --env-file .env.production up -d --build --wait
# Variables: .env.production.example. The lead API is never published: only Caddy has ports (D-033).
name: jokar-dental

x-backend: &backend
  build: ../backend
  env_file: ${PROD_ENV_FILE:-../.env.production}
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    DJANGO_DEBUG: "false"
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    <<: *backend
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py createcachetable &&
      python manage.py collectstatic --noinput --verbosity 0 &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30 --access-logfile -"
    volumes:
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': 'backend'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker: # Telegram outbox: retries pending notifications every minute (D-032)
    <<: *backend
    command: sh -c "while true; do python manage.py deliver_pending_notifications; sleep 60; done"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:?}
    environment:
      LEAD_API_URL: http://backend:8000/api/v1/leads/
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/django-static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backup: # daily pg_dump in custom format; dumps older than 14 days are pruned. Copy ./backups off the server.
    image: postgres:18
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?}
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh"]
    configs:
      - source: backup_script
        target: /backup.sh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

configs:
  backup_script:
    file: ./backup.sh

volumes:
  pgdata:
  static:
  caddy_data:
  caddy_config:
