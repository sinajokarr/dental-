# Local development database only. Run from the repository root:
#   docker compose -f infrastructure/compose.dev.yml --env-file .env up -d --wait
name: jokar-dental-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432" # localhost only
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18+ image: mount the parent directory (PGDATA is /var/lib/postgresql/18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
